[project]
name = "jobfather-crawler"
version = "0.1.0"
description = "URL-driven, human-in-the-loop job posting ingestion for the-job-father"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crawl4ai>=0.9,<0.10",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "openai>=1.40",
    "tenacity>=8.5",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
jobfather-crawler = "jobfather_crawler.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobfather_crawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
